# Architecture companion to the pinned Quattro pacman configuration.
# Official Arch core/extra/multilib plus Omarchy's signed stable repository,
# which serves x86_64 binaries keyed by $arch.
[options]
Color
ILoveCandy
VerbosePkgLists
HoldPkg = pacman glibc
# QEMU direct-boots the immutable kernel and initramfs beside the guest disk.
# Keep the installed modules on that exact ABI until the native launcher can
# atomically promote a matching external kernel and initramfs after updates.
IgnorePkg = linux
Architecture = auto
CheckSpace
ParallelDownloads = 5
DownloadUser = alpm
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[omarchy]
SigLevel = Optional TrustAll
Server = https://pkgs.omarchy.org/stable/$arch
